name: PR preview

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: write-all

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Preview
        run: echo "Preview ready for PR ${{ github.event.pull_request.number }}"
